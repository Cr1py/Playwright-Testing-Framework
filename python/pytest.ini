[pytest]
testpaths = tests
pythonpath = src
# --import-mode=importlib: test files in different layers/projects may share a basename
# Allure results go to python/allure-results 
# video/screenshot/tracing flags come from pytest-playwright
addopts =
    -ra
    --import-mode=importlib
    -n auto
    --alluredir=allure-results
    --clean-alluredir
    --video=retain-on-failure
    --screenshot=only-on-failure
    --tracing=retain-on-failure
markers =
    ui: browser tests of the frontend
    api: black-box API tests, no browser
    e2e: UI action followed by API/backend verification
